name: Import project source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and unpack source
        run: |
          cat payload/part-* > /tmp/source.b64
          base64 -d /tmp/source.b64 > /tmp/source.zip
          unzip -q -o /tmp/source.zip
          rm -rf payload .github/workflows/import-source.yml
      - name: Commit imported project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish War Groups: Zone source"
          git push
