name: Import project source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and unpack source
        run: |
          curl -fsSL "https://war-groups-zone.dmytrolevada.chatgpt.site/war-groups-zone-source.zip" -o /tmp/source.zip
          unzip -q -o /tmp/source.zip
          rm -f .github/workflows/import-source.yml
      - name: Commit imported project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish War Groups: Zone source"
          git push
